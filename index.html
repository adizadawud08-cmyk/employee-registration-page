<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Registration</title>
</head>
<body>
  <header>
    <h2>
      Employee Registration
    </h2>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Employees</a>
    <a href="#">About</a>
  </nav>

  <main>
    <p>
      Employee Registration
    </p>
    
    <form action="">
    
        <label for="text">Full Name:</label>
        <input type="text" id="name"required placeholder="enter your name"><br><br>
      
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="enter your email" required><br>

        <label for="department">Department:</label>
        <select id="department" name="department">
          <option>Select Department</option>
          <option value="it">IT</option>
          <option value="HR">HR</option>
          <option value="finance">Finance</option>
          <option value="marketing">Marketing</option>
        </select><br><br>

        Gender:<br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>

        <input type="radio" id="Female" name="gender" value="female">
        <label for="female">Female</label><br>
        
        <input type="radio" for="other">
        <label for="other"  id="Other" name="gender" value="other">Other</label><br><br>

        Skill:<br>
        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label><br>
        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label><br>
        <input type="checkbox" id="javascript" name="skills" value="javascript">
        <label for="javascript">javascript<br><br>

          <label for="profile">Profile:</label>
          <input type="file" id="profile" name="profile" value="profile"><br><br>
          
        <label for="bio">Bio:</label><br>
        <textarea id="bio" name="bio"></textarea><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button> 
    </form>

    <table>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
      </tr>
      <tr>
        <td>Aisha</td>
        <td>adiza@email.com</td>
        <td>IT</td>
      </tr>
      <tr>
        <td>Dawud</td>
        <td>ibrahim@email.com</td>
        <td>HR</td>
      </tr>
    </table>
  </main>
</body>
</html>
